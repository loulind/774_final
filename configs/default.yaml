# Run settings: compute budgets, seed, LLM and reporting thresholds.
# Which tools run, in what order and with which parameters is decided by the agent
# from the data profile, the challenge register and the objective -- never here.
seed: 774
device: auto        # auto | cuda | mps | cpu (feature extraction)
fit_device: cpu     # model fits on tabular inputs; cpu is bit-for-bit reproducible
max_critic_revisions: 1

full:
  total_seconds: 10800        # estimated cost of the whole plan
  step_seconds: 3600          # estimated cost of any one step
  train_seconds_per_fit: 240  # scaled by device (cpu x0.5)
  max_epochs: 300
  max_folds: 5
  inner_folds: 3
  bootstrap_reps: 20
  permutations: 999
  eval_max_samples: 5000
  screening_train: 2000
  screening_val: 500
  max_candidates: 4

criteria:
  fdr: 0.05
  ci_level: 0.95
  min_abs_log2fc: 1.0
  reliable_min_test_positives: 20
  reliable_min_auroc_lower: 0.80

llm:
  enabled: true
  model: claude-opus-5-5      # check `claude --help` / the run manifest for the model that answered
  max_output_tokens: 16000
  effort: {objective: medium, planner: high, critic: high, writer: medium}
  max_budget_usd: 3.0
  structured_output: true
  timeout_seconds: 600
